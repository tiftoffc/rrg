name: Update RRG Data

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run RRG updater
        run: python scripts/update_rrg.py

      - name: Show written files
        run: |
          echo "=== Inhalt von public/ ==="
          ls -la public/
          echo "=== Existiert rrg-weekly.json? ==="
          ls -la public/rrg-weekly.json || echo "Datei nicht gefunden"
          echo "=== Erste Zeilen ==="
          head -n 20 public/rrg-weekly.json || true

      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update RRG data"
          file_pattern: |
            public/rrg-daily.json
            public/rrg-weekly.json
            public/last_update.json
            public/rrg-data.json
