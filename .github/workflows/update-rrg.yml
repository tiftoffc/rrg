name: Update RRG Data

on:
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas

      - name: Run RRG updater
        run: python scripts/update_rrg.py

      - name: Run Trend updater
        run: python scripts/update_trend.py

      - name: Run Trend updater
        run: python scripts/update_trend.py

      - name: Check trend file
        run: |
          ls -la public/
          echo "---"
          head -n 30 public/trend_4w.json || echo "trend_4w.json nicht gefunden" 

      - name: Verify files
        run: |
          echo "Dateien nach dem Skript:"
          ls -la public/
          echo "---"
          wc -l public/rrg-weekly.json || echo "rrg-weekly.json fehlt"

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add public/rrg-daily.json public/rrg-weekly.json public/last_update.json public/trend_4w.json
          git status
          git diff --staged --quiet || (git commit -m "chore: update RRG + trend data" && git push)
          fi
